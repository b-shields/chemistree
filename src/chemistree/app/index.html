<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>chemistree</title>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .row { display: flex; gap: 16px; align-items: flex-start; }
    #mol2d { width: 420px; height: 420px; border: 1px solid #ddd; }
    #mol3d { flex: 1; height: 420px; border: 1px solid #ddd; position: relative; }
    #cmd { width: 520px; padding: 6px; font-family: monospace; }
    #log { color: #555; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>chemistree &mdash; <span id="smiles"></span></h1>
  <div class="row">
    <div id="mol2d"></div>
    <div id="mol3d"></div>
  </div>
  <p>
    <input id="cmd" placeholder="find chloro | nearest chloro ASP | swap 7 fluoro | undo 7" />
    <button onclick="send()">run</button>
    <span id="log"></span>
  </p>
  <script>
    const viewer = $3Dmol.createViewer("mol3d", { backgroundColor: "white" });
    let ligand = null, receptor = null;
    async function loadReceptor() {
      const pdb = await (await fetch("/receptor")).text();
      if (pdb.trim()) {
        receptor = viewer.addModel(pdb, "pdb");
        receptor.setStyle({}, { cartoon: { color: "spectrum", opacity: 0.4 } });
      }
    }
    function showPocket() {
      if (!receptor) return;
      const near = { byres: true, within: { distance: 5, sel: { model: ligand.getID() } } };
      receptor.setStyle({}, { cartoon: { color: "spectrum", opacity: 0.4 } });
      receptor.setStyle(near, { line: { colorscheme: "grayCarbon" } });
      viewer.removeAllLabels();
      viewer.addResLabels(
        Object.assign({ model: receptor.getID() }, near),
        { fontSize: 11, fontColor: "black", showBackground: false }
      );
    }
    function show(state) {
      document.getElementById("smiles").textContent = state.smiles;
      document.getElementById("mol2d").innerHTML = state.svg;
      if (ligand) viewer.removeModel(ligand);
      ligand = viewer.addModel(state.molblock, "mol");
      ligand.setStyle({}, { stick: { colorscheme: "greenCarbon" } });
      showPocket();
      viewer.zoomTo({ model: ligand.getID() });
      viewer.render();
    }
    loadReceptor();
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (e) => show(JSON.parse(e.data));
    async function send() {
      const input = document.getElementById("cmd");
      const res = await fetch("/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value }),
      });
      const data = await res.json();
      const log = document.getElementById("log");
      log.textContent = data.error ? "error: " + data.error : data.message;
      if (data.state) show(data.state);
      input.value = "";
    }
    document.getElementById("cmd").addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
