<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>chemistree</title>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .row { display: flex; gap: 16px; align-items: flex-start; }
    #mol2d, #mol3d {
      width: 440px; height: 360px;
      border: 1px solid #ddd; position: relative;
    }
    pre { background: #f6f6f6; padding: 10px; border-radius: 6px; white-space: pre-wrap; }
    #cmd { width: 480px; padding: 6px; font-family: monospace; }
    #log { color: #555; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>chemistree &mdash; <span id="smiles"></span></h1>
  <div class="row">
    <div id="mol2d"></div>
    <div id="mol3d"></div>
    <pre id="describe" style="flex:1"></pre>
  </div>
  <p>
    <input id="cmd" placeholder="find chloro | nearest chloro ASP | swap 7 fluoro | undo 7" />
    <button onclick="send()">run</button>
    <span id="log"></span>
  </p>
  <script>
    const viewer = $3Dmol.createViewer("mol3d", { backgroundColor: "white" });
    let ligand = null;
    async function loadReceptor() {
      const pdb = await (await fetch("/receptor")).text();
      if (pdb.trim()) {
        const receptor = viewer.addModel(pdb, "pdb");
        receptor.setStyle({}, { cartoon: { color: "spectrum" } });
      }
    }
    function show(state) {
      document.getElementById("smiles").textContent = state.smiles;
      document.getElementById("mol2d").innerHTML = state.svg;
      document.getElementById("describe").textContent = state.describe;
      if (ligand) viewer.removeModel(ligand);
      ligand = viewer.addModel(state.molblock, "mol");
      ligand.setStyle({}, { stick: {} });
      viewer.zoomTo({ model: ligand });
      viewer.render();
    }
    loadReceptor();
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (e) => show(JSON.parse(e.data));
    async function send() {
      const input = document.getElementById("cmd");
      const res = await fetch("/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value }),
      });
      const data = await res.json();
      const log = document.getElementById("log");
      log.textContent = data.error ? "error: " + data.error : data.message;
      if (data.state) show(data.state);
      input.value = "";
    }
    document.getElementById("cmd").addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
