<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>chemistree</title>
  <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
  <style>
    body {
      font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px;
      background: #0d0d0d; color: #ddd;
    }
    .row { display: flex; gap: 16px; align-items: flex-start; }
    #mol2d { width: 420px; height: 420px; border: 1px solid #333; }
    #mol3d { flex: 1; height: 420px; border: 1px solid #333; position: relative; }
    #chat { margin-top: 12px; }
    #feed {
      height: 110px; overflow-y: auto; padding: 8px 10px;
      background: #111; border: 1px solid #333; border-bottom: none;
      display: flex; flex-direction: column; gap: 6px;
    }
    .msg { white-space: pre-wrap; }
    .msg.user { color: #7fd08a; }
    .msg.tool { color: #888; font-style: italic; }
    .msg.err { color: #e06c6c; }
    #say {
      width: 100%; box-sizing: border-box; resize: none;
      padding: 8px 10px; font: inherit; line-height: 1.4;
      background: #1a1a1a; color: #ddd; border: 1px solid #333;
    }
    #say:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="row">
    <div id="mol2d"></div>
    <div id="mol3d"></div>
  </div>
  <div id="chat">
    <div id="feed"></div>
    <textarea id="say" rows="1"
      placeholder="add an isopropyl meta to the pyridine…"></textarea>
  </div>
  <script>
    const viewer = $3Dmol.createViewer("mol3d", { backgroundColor: "#0d0d0d" });
    let ligand = null, receptor = null;
    async function loadReceptor() {
      const pdb = await (await fetch("/receptor")).text();
      if (pdb.trim()) receptor = viewer.addModel(pdb, "pdb");
    }
    async function stylePocket() {
      if (!receptor) return;
      const residues = await (await fetch("/pocket")).json();
      const rid = receptor.getID();
      // Ribbon for the whole receptor, side-chain + backbone lines for the pocket.
      viewer.setStyle({ model: rid }, { cartoon: { color: "spectrum" } });
      viewer.removeAllLabels();
      const byChain = {};
      residues.forEach((r) => ((byChain[r.chain] ||= []).push(r.resi)));
      for (const [chain, resi] of Object.entries(byChain)) {
        const sel = { model: rid, resi };
        if (chain.trim()) sel.chain = chain;
        viewer.addStyle(sel, { line: { colorscheme: "cyanCarbon" } });
        viewer.addResLabels(sel, { fontSize: 11, fontColor: "white", showBackground: false });
      }
      viewer.render();
    }
    function show(state) {
      document.getElementById("mol2d").innerHTML = state.svg;
      if (ligand) viewer.removeModel(ligand);
      ligand = viewer.addModel(state.molblock, "mol");
      ligand.setStyle({}, { stick: { colorscheme: "greenCarbon" } });
      viewer.zoomTo({ model: ligand.getID() });
      viewer.render();
      stylePocket();
    }
    loadReceptor();
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (e) => show(JSON.parse(e.data));

    // Chat with headless Claude Code. The molecule updates arrive over /ws when
    // Claude calls an MCP tool; this panel only carries the conversation.
    const feed = document.getElementById("feed");
    const say = document.getElementById("say");
    function addMsg(cls, text) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      feed.appendChild(div);
      feed.scrollTop = feed.scrollHeight;
    }
    const cws = new WebSocket(`ws://${location.host}/chat`);
    cws.onmessage = (e) => {
      const ev = JSON.parse(e.data);
      if (ev.kind === "text") addMsg("bot", ev.text);
      else if (ev.kind === "tool") addMsg("tool", "· " + ev.phrase + "…");
      else if (ev.kind === "error") addMsg("err", ev.message);
      else if (ev.kind === "done") { say.disabled = false; say.focus(); }
    };
    function autoGrow() {
      say.style.height = "auto";
      say.style.height = Math.min(say.scrollHeight, 100) + "px";
    }
    say.addEventListener("input", autoGrow);
    say.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const text = say.value.trim();
        if (!text || say.disabled) return;
        addMsg("user", text);
        cws.send(JSON.stringify({ type: "message", text }));
        say.value = "";
        autoGrow();
        say.disabled = true;
      }
    });
  </script>
</body>
</html>
